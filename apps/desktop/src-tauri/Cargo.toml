[package]
name = "dshd"
version = "0.1.13"
description = "dshd desktop shell"
authors = ["DeepSeek"]
edition = "2021"
rust-version = "1.77"
default-run = "dshd"

[lib]
name = "dsh_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
ctrlc = { version = "3", features = ["termination"] }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = "0.14"
# dynamic-acl: the sidecar port is OS-assigned, so the capability that lets
# its page reach this shell's commands is registered once the port is known.
tauri = { version = "2.11", features = ["tray-icon", "image-png", "dynamic-acl"] }
tauri-plugin-single-instance = "2.3"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Build scripts and proc-macro crates are host units and are loaded back by
# rustc during the same build. Stripping a proc-macro dynamic library that also
# carries remapped source paths (see .cargo/config.toml) leaves a Mach-O whose
# LINKEDIT string pool is mis-aligned, which dyld refuses to load and which then
# fails every crate using a derive macro with `E0463`.
[profile.release.build-override]
strip = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dshd</title>
    <link rel="stylesheet" href="./styles.css" />
    <script>
      // Defined in <head> so shell-side evals cannot race the definitions.
      window.__DSH_SHOW_ERROR__ = (message) => {
        const stage = document.getElementById('stage')
        const status = document.getElementById('status')
        const detail = document.getElementById('detail')
        const openLogs = document.getElementById('open-logs')
        const restart = document.getElementById('restart-host')
        if (!stage || !status || !detail || !openLogs || !restart) return
        stage.dataset.state = 'error'
        status.textContent = 'The local host did not become ready.'
        detail.hidden = false
        detail.textContent = String(message)
        openLogs.hidden = false
        restart.hidden = false
      }

      window.__DSH_SHOW_MIGRATION__ = (message) => {
        const stage = document.getElementById('stage')
        const status = document.getElementById('status')
        const detail = document.getElementById('detail')
        if (!stage || !status || !detail) return
        stage.dataset.state = 'migration'
        status.textContent = 'Imported existing CLI data into the desktop home.'
        detail.hidden = false
        detail.textContent = String(message)
      }

      window.addEventListener('DOMContentLoaded', () => {
        const invoke = (name) => {
          const core = window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke
          if (core) return core(name)
          const internals = window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke
          if (internals) return internals(name)
        }
        document.getElementById('open-logs').addEventListener('click', () => {
          invoke('open_log_directory')
          if (window.__DSH_OPEN_LOGS__) window.__DSH_OPEN_LOGS__()
        })
        document.getElementById('restart-host').addEventListener('click', () => {
          invoke('restart_for_plugins')
        })
      })
    </script>
  </head>
  <body>
    <main id="stage" data-state="loading">
      <div class="mark" aria-hidden="true">
        <span class="ring"></span>
        <span class="core"></span>
      </div>
      <h1>dshd</h1>
      <p id="status">Starting the local host…</p>
      <p id="detail" hidden></p>
      <button id="open-logs" type="button" hidden>Open log directory</button>
      <button id="restart-host" type="button" hidden>Restart local host</button>
    </main>
  </body>
</html>

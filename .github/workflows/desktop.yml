name: Desktop

on:
  push:
    paths:
      - 'apps/desktop/**'
      - 'apps/cli/package.json'
      - 'packages/boot/app-boot/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/cli/package.json'
      - 'packages/boot/app-boot/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
  # tag: publish a GitHub Release with unsigned artifacts. Signing/notarize
  # stays commented until certificates exist (M2).
  # push:
  #   tags: ['desktop-v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm run build

      - name: Pack sidecar
        run: node apps/desktop/scripts/pack-sidecar.mjs

      - name: Build unsigned desktop app
        working-directory: apps/desktop
        run: pnpm exec tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
          # Signing / notarize (M2):
          # APPLE_CERTIFICATE
          # APPLE_CERTIFICATE_PASSWORD
          # APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
          # WINDOWS_CERTIFICATE

      - name: Re-embed sidecar into macOS .app
        if: runner.os == 'macOS'
        run: node apps/desktop/scripts/pack-sidecar.mjs embed

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: dshd-macos
          path: apps/desktop/src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: warn

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: dshd-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

